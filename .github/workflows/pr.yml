name: pr

on:
  pull_request:
    # main is the repository's default branch; master was the original target.
    branches:
      - main
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Nix (with flake support)
        uses: cachix/install-nix-action@v20
        with:
          extra_nix_config: sandbox = true

      - name: Run tests
        run: nix develop --command sbt +test

      # Links the Scala.js DOM fixture and runs it in Nix-pinned headless
      # Chromium and WebKit, then checks that the runner fails closed.
      - name: Run the DOM fixture in Chromium and WebKit
        run: nix develop .#browser --no-write-lock-file --command bash scripts/test-dom-fixture.sh


